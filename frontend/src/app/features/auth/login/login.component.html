<app-auth-layout>
  <div class="auth-form">
    <span class="auth-kicker"><app-icon name="shield" [size]="15" /> Espace sécurisé</span>
    <h1 class="titre">Bienvenue</h1>
    <p class="sous-titre">Connectez-vous à votre espace d’archives GED ENG.</p>

    <form [formGroup]="form" (ngSubmit)="soumettre()" novalidate>
      <div class="field">
        <label for="username">Identifiant</label>
        <div class="input-wrap">
          <app-icon class="lead" name="user" [size]="18" />
          <input
            id="username"
            type="text"
            formControlName="username"
            autocomplete="username"
            [attr.aria-invalid]="form.controls.username.touched && form.controls.username.invalid"
          />
        </div>
        @if (form.controls.username.touched && form.controls.username.invalid) {
          <small class="erreur-champ" role="alert">L’identifiant est obligatoire.</small>
        }
      </div>

      <app-password-field
        id="password"
        label="Mot de passe"
        [control]="form.controls.password"
      />

      @if (erreur()) {
        <div class="alert alert-error" role="alert">
          <app-icon name="alert" [size]="18" />
          <span>{{ erreur() }}</span>
        </div>
      }

      <button type="submit" class="btn btn-primary btn-block bouton-connexion" [disabled]="chargement()">
        {{ chargement() ? 'Connexion...' : 'Se connecter' }}
        @if (!chargement()) { <app-icon name="key" [size]="18" /> }
      </button>
    </form>

    <p class="lien-oublie"><a routerLink="/mot-de-passe-oublie">Mot de passe oublié ?</a></p>
    <p class="inscription">
      Vous n’avez pas encore de compte ?
      <a routerLink="/inscription">Créer un compte</a>
    </p>
  </div>
</app-auth-layout>
